
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-demo
  namespace: app-demo
  labels:
    app: app-demo
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-demo
  template:
    metadata:
      labels:
        app: app-demo
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app-demo
          image: ghcr.io/pivito/app-demo-devsecops:0745e2b1add3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
