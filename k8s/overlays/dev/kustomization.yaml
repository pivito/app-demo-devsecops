apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-demo-dev

resources:
  - ../../base
images:
  - name: ghcr.io/pivito/app-demo-devsecops
    newTag: 0745e2b1add3

replicas:
  - name: app-demo
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: app-demo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 4
