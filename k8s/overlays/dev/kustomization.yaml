apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-demo-dev

resources:
  - ../../base

replicas:
  - name: app-demo
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: app-demo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
