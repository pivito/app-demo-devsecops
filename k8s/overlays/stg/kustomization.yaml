apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-demo-stg

resources:
  - ../../base

replicas:
  - name: app-demo
    count: 2

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: app-demo
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
