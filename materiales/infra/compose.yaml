services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: ${SONAR_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER} -d ${SONAR_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - devsecops

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${SONAR_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - devsecops
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - devsecops
  trivy:
    image: aquasec/trivy:latest
    command: server --listen 0.0.0.0:4954
    restart: unless-stopped
    volumes:
      - trivy_cache:/root/.cache
    networks:
      - devsecops
  buildkit:
    image: moby/buildkit:rootless
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    command:
      - --addr
      - tcp://0.0.0.0:1234
    volumes:
      - buildkit_cache:/home/user/.local/share/buildkit
    networks:
      - devsecops

networks:
  devsecops:
    driver: bridge

volumes:
  postgres_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  jenkins_home:
  trivy_cache:
  buildkit_cache:
