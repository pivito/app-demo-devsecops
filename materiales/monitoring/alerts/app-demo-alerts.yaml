apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-demo-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: app-demo.rules
      rules:
        - alert: AppDemoSinReplicasDisponibles
          expr: |
            kube_deployment_status_replicas_available{
              namespace="app-demo",
              deployment="app-demo"
            } == 0
          for: 1m
          labels:
            severity: critical
            service: app-demo
          annotations:
            summary: "La aplicación app-demo no tiene réplicas disponibles"
            description: "El Deployment app-demo lleva más de un minuto sin réplicas disponibles."
