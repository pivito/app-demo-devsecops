apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  namespace: storage-lab
spec:
  containers:
    - name: storage-test
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 36000
      volumeMounts:
        - name: datos
          mountPath: /datos
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: datos-recuperados-pvc
