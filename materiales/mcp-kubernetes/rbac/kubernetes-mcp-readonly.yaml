apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: app-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mcp-readonly
  namespace: app-demo
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - events
      - configmaps
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-readonly
  namespace: app-demo
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: app-demo
roleRef:
  kind: Role
  name: kubernetes-mcp-readonly
  apiGroup: rbac.authorization.k8s.io
